<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>历史新闻数据集进度 · 观澜</title>
<link rel="stylesheet" href="./style.css?v=5">
<script src="./progress.js?v=clean-copy" defer></script>
  <link rel="stylesheet" href="../market-theme.css?v=source-cards-20261124">
  <script src="../market-theme.js?v=source-cards-20261124"></script>
  <link rel="stylesheet" href="../research-assistant.css?v=source-cards-20261124">
  <script defer src="../research-assistant.js?v=source-cards-20261124" data-assistant-page="training-progress"></script>
</head>
<body>
<main>
  <header>
    <a href="../">← 返回观澜</a>
    <h1>历史新闻数据集进度</h1>
    <p id="scope">正在读取采集进度…</p>
  </header>

  <section id="metrics" aria-label="进度统计" hidden>
    <article><h2>采集核验</h2><strong id="queried">—</strong><p id="with-news"></p></article>
    <article><h2>资讯入库</h2><strong id="collected">—</strong><p id="missing"></p></article>
    <article><h2>已标注</h2><strong id="labelled">—</strong><p id="pending"></p></article>
    <article><h2>待标注资讯</h2><strong id="pending-labels">—</strong><p id="finished-days"></p></article>
  </section>

  <div class="activity">
    <p id="message" role="status"></p>
    <p id="collection-cooldown" hidden></p>
    <p id="label-cooldown" hidden></p>
  </div>

  <section class="coverage" id="coverage" aria-labelledby="coverage-title" hidden>
    <div class="coverage-head">
      <h2 id="coverage-title">每日进度</h2>
      <div class="phase-switch" role="group" aria-label="日历视图">
        <button id="show-collection" type="button" aria-pressed="true">采集</button>
        <button id="show-labels" type="button" aria-pressed="false">标注</button>
      </div>
    </div>

    <div class="coverage-body">
      <section class="calendar" aria-label="日期月历">
        <div class="month-nav" aria-label="切换月份">
          <button type="button" id="previous-month" aria-label="上个月">‹</button>
          <select id="month" aria-label="月份"></select>
          <button type="button" id="next-month" aria-label="下个月">›</button>
        </div>
        <ul class="legend" id="legend" aria-label="颜色图例"></ul>
        <div class="weekdays" aria-hidden="true">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div id="days" role="group" aria-label="当月日期"></div>
      </section>

      <aside class="details" aria-labelledby="selected-date">
        <h3 id="selected-date"></h3>
        <div class="detail-stage">
          <div class="stage-head"><h4>采集</h4><span class="badge" id="collection-status"></span></div>
          <p id="collection-summary"></p>
          <p id="collection-detail" hidden></p>
        </div>
        <div class="detail-stage">
          <div class="stage-head"><h4>标注</h4><span class="badge" id="label-status"></span></div>
          <p id="label-summary"></p>
          <p id="label-detail" hidden></p>
        </div>
      </aside>
    </div>
  </section>
  <footer id="sampling"></footer>
</main>
  <footer class="site-beian" style="text-align:center;padding:18px 12px 26px;font-size:11px;color:#8b97a5;"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;">苏ICP备2026093550号</a></footer>
</body>
</html>

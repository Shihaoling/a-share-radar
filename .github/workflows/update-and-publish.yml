name: Update research and publish
on:
  push:
    branches: [main]
    paths-ignore: ['web/data/dashboard.json', 'web/data/reviews.json']
  workflow_dispatch:
    inputs:
      enable_mlp:
        description: 'Train the optional small MLP challenger'
        type: boolean
        default: false
  schedule:
    # UTC: 09:07/09:37–15:37 Shanghai; off the busy top of the hour.
    # GitHub scheduling is best effort, never a real-time market feed.
    - cron: '7,37 1-7 * * 1-5'
    # Evening world news and weekend updates, Shanghai 21:17.
    - cron: '17 13 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: research-publish
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install data and model dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify time, leakage and review invariants
        run: python -m unittest discover -s tests -v
      - name: Update snapshots and evaluate predictions
        if: github.event_name != 'push'
        env:
          ENABLE_MLP: ${{ inputs.enable_mlp }}
        run: |
          if [ "$ENABLE_MLP" = "true" ]; then
            python -m pipeline.run --enable-mlp
          else
            python -m pipeline.run
          fi
      - name: Persist observations and forecast ledger
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/dashboard.json web/data/reviews.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh observations and daily review [skip ci]'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: research
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

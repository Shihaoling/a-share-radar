name: Update research and publish
on:
  push:
    branches: [main]
    paths-ignore: ['web/data/dashboard.json', 'web/data/reviews.json', 'web/data/tushare-capabilities.json', 'web/data/view.json', 'web/data/health.json', 'web/data/page-quotes.json', 'data/equity/daily/**', 'data/equity/forecasts/**', 'data/equity/state.json', 'data/equity/bootstrap-complete.json']
  workflow_dispatch:
    inputs:
      quotes_only:
        description: 'Only collect intraday snapshots during market hours'
        type: boolean
        default: false
      stock_api_only:
        description: 'Only validate/update the configured stock API; reuse other sources'
        type: boolean
        default: false
      probe_group:
        description: 'Bounded Tushare capability audit; audit_15000 makes at most 20 requests'
        type: choice
        options: ['none', 'core', 'live_news', 'financials', 'fund_macro', 'news_extended', 'premium', 'audit_15000']
        default: 'none'
      bootstrap_rounds:
        description: 'Initial SW31 fill; at most 12 primary requests per round'
        type: choice
        options: ['0', '8']
        default: '0'
  schedule:
    # UTC: every day 09:00/09:30–15:30, plus 16:00 Shanghai.
    # GitHub scheduling is best effort, never a real-time market feed.
    - cron: '0,30 1-7 * * *'
    - cron: '0 8 * * *'
    # Combined with full refreshes: approximately five-minute snapshot cadence.
    # Pipeline skips holidays, pre-open, lunch and after-close quote-only runs.
    - cron: '5,10,15,20,25,35,40,45,50,55 1-7 * * 1-5'
    # Capture vendor industry closes released later than exchange close, 18:40 Shanghai.
    - cron: '40 10 * * 1-5'
    # SW historical minutes arrive 19:00–20:00; bounded batches after release.
    - cron: '10,25,40,55 12 * * 1-5'
    # Evening world news and weekend updates, Shanghai 21:17.
    - cron: '17 13 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: research-publish
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install data and model dependencies
        run: python -m pip install -r requirements.txt
      - name: Check bounded history bootstrap eligibility
        id: equity_gate
        env:
          QUOTE_ONLY: ${{ inputs.quotes_only }}
          SCHEDULE: ${{ github.event.schedule }}
          PROBE_GROUP: ${{ inputs.probe_group }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          root = Path('data/equity')
          quote = os.environ.get('QUOTE_ONLY') == 'true' or os.environ.get('SCHEDULE') == '5,10,15,20,25,35,40,45,50,55 1-7 * * 1-5'
          eligible = (root / 'bootstrap-request.json').exists() and not (root / 'bootstrap-complete.json').exists() and not quote and os.environ.get('PROBE_GROUP', '') in ('', 'none')
          state = json.loads((root / 'state.json').read_text()) if (root / 'state.json').exists() else {}
          until = datetime.fromisoformat(state['cooldown_until']) if state.get('cooldown_until') else None
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run_bootstrap={str(eligible).lower()}\n')
          PY
      - name: Check one-time bilingual sentiment request
        id: sentiment_gate
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          request=Path('data/news_sentiment/reclassify-request.json')
          report=Path('data/news_sentiment/inference-report.json')
          old=json.loads(report.read_text()) if report.exists() else {}
          required=json.loads(request.read_text()) if request.exists() else {}
          ready=all(old.get('models',{}).get(k,{}).get('revision')==v for k,v in required.get('revisions',{}).items()) and bool(old.get('completed_at'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('run='+str(bool(required) and not ready).lower()+'\n')
          PY
      - name: Cache Chinese finance sentiment model
        if: steps.sentiment_gate.outputs.run == 'true' || (github.event_name == 'workflow_dispatch' && inputs.bootstrap_rounds == '8' && inputs.probe_group == 'none')
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-bilingual-e91b1a3-0bc2ac1-python312
          restore-keys: finbert-chinese-e91b1a3-python312
      - name: Install CPU sentiment inference
        if: steps.sentiment_gate.outputs.run == 'true' || (github.event_name == 'workflow_dispatch' && inputs.bootstrap_rounds == '8' && inputs.probe_group == 'none')
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r requirements-sentiment.txt
      - name: Install uploaded local model inference runtime
        if: hashFiles('data/equity/models/deployed-model.json') != ''
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
      - name: Verify time, leakage and review invariants
        run: python -m unittest discover -s tests -v
      - name: Fill initial all-share history
        if: steps.equity_gate.outputs.run_bootstrap == 'true'
        env:
          STOCK_API_TOKEN: ${{ secrets.STOCK_API_TOKEN }}
          RADAR_EXPECTED_STOCK_KEY_SHA256: 097e4198dc756beefb9e15fca6aacd6abf54ab4ebd27a4d2243531605c82faa5
          RADAR_SERVICE_GATE_FILE: ${{ runner.temp }}/sxdata-rate-gate.json
          RADAR_ALLOW_TRAINING: 'false'
        run: python -m pipeline.equity_update --bootstrap-if-needed --days 180 --max-requests 180
      - name: Verify real Chinese finance model inference
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_rounds == '8' && inputs.probe_group == 'none'
        run: |
          python - <<'PY'
          from pipeline.sentiment import _finbert_scores, MODEL_ID, MODEL_REVISION
          items = [
              {'id': 'positive', 'title': '公司营业收入和净利润均大幅增长，业绩明显超出市场预期。'},
              {'id': 'negative', 'title': '公司营业收入和净利润大幅下降，持续亏损且面临债务违约风险。'},
          ]
          scores = _finbert_scores(items, {'torch_threads': 2})
          assert all(v['method'] == 'finbert_chinese_cpu' and v['model_version'] == MODEL_ID + '@' + MODEL_REVISION for v in scores.values())
          assert scores['positive']['score'] > scores['negative']['score']
          for key, value in scores.items():
              print(key, value['label'], value['score'], value['method'])
          print('CPU_MODEL_SMOKE_OK')
          PY
      - name: Install rendered-page collector
        if: github.event_name != 'push' && (!inputs.probe_group || inputs.probe_group == 'none') && inputs.stock_api_only != true
        run: |
          python -m pip install -r requirements-crawler.txt
          python -m playwright install --with-deps chromium
      - name: Update snapshots and evaluate predictions
        if: github.event_name != 'push'
        env:
          STOCK_API_TOKEN: ${{ secrets.STOCK_API_TOKEN }}
          RADAR_EXPECTED_STOCK_KEY_SHA256: 097e4198dc756beefb9e15fca6aacd6abf54ab4ebd27a4d2243531605c82faa5
          RADAR_SERVICE_GATE_FILE: ${{ runner.temp }}/sxdata-rate-gate.json
          RADAR_ALLOW_TRAINING: 'false'
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          STOCK_API_ONLY: ${{ inputs.stock_api_only }}
          PROBE_GROUP: ${{ inputs.probe_group }}
          QUOTES_ONLY: ${{ inputs.quotes_only }}
          SCHEDULE: ${{ github.event.schedule }}
          BOOTSTRAP_ROUNDS: ${{ inputs.bootstrap_rounds }}
        run: |
          if [ -n "$PROBE_GROUP" ] && [ "$PROBE_GROUP" != "none" ]; then
            python -m pipeline.probe_stock_api --group "$PROBE_GROUP"
          elif [ "$BOOTSTRAP_ROUNDS" = "8" ]; then
            python -m pipeline.run --bootstrap-rounds 8
          elif [ "$STOCK_API_ONLY" = "true" ]; then
            python -m pipeline.run --stock-api-only
          elif [ "$QUOTES_ONLY" = "true" ] || [ "$SCHEDULE" = '5,10,15,20,25,35,40,45,50,55 1-7 * * 1-5' ]; then
            python -m pipeline.run --quotes-only
          else
            python -m pipeline.run
          fi
      - name: Collect Eastmoney rendered tables with bounded pagination
        if: github.event_name != 'push' && (!inputs.probe_group || inputs.probe_group == 'none') && inputs.stock_api_only != true
        run: python -m pipeline.page_quotes --once
      - name: Verify new primary service and inventory supported data
        if: inputs.quotes_only != true && github.event.schedule != '5,10,15,20,25,35,40,45,50,55 1-7 * * 1-5'
        env:
          STOCK_API_TOKEN: ${{ secrets.STOCK_API_TOKEN }}
          RADAR_EXPECTED_STOCK_KEY_SHA256: 097e4198dc756beefb9e15fca6aacd6abf54ab4ebd27a4d2243531605c82faa5
          RADAR_SERVICE_GATE_FILE: ${{ runner.temp }}/sxdata-rate-gate.json
        run: python -m pipeline.service_rollout
      - name: Refresh primary daily inputs for the new classifier once
        if: steps.sentiment_gate.outputs.run == 'true' && github.event_name == 'push'
        env:
          STOCK_API_TOKEN: ${{ secrets.STOCK_API_TOKEN }}
          RADAR_EXPECTED_STOCK_KEY_SHA256: 097e4198dc756beefb9e15fca6aacd6abf54ab4ebd27a4d2243531605c82faa5
          RADAR_SERVICE_GATE_FILE: ${{ runner.temp }}/sxdata-rate-gate.json
          RADAR_ALLOW_TRAINING: 'false'
        run: python -m pipeline.run --stock-api-only
      - name: Score archived Chinese and English news once
        if: steps.sentiment_gate.outputs.run == 'true'
        run: python scripts/score-news.py
      - name: Enrich full article text and MiniMax summaries once after rollout
        if: github.event_name == 'push'
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          python - <<'PY'
          import json,subprocess,os
          from pathlib import Path
          p=Path('data/news_sentiment/fulltext-report.json')
          old=json.loads(p.read_text()) if p.exists() else {}
          if old.get('request_id') != 'news-library-digest-v1' or (not old.get('model', {}).get('key_configured') and bool(os.environ.get('MINIMAX_API_KEY'))):
              subprocess.run(['python','-m','pipeline.news_update','--reuse-body-cache','--discover','--model-limit','0','--model-budget-seconds','0'],check=True)
          else:
              cfg=json.loads(Path('config/settings.json').read_text())
              d=json.loads(Path('web/data/dashboard.json').read_text())
              from pipeline.news_digest import VERSION
              if d.get('stock_api_state',{}).get('news',{}).get('records') and (old.get('primary_source_version')!=cfg.get('stock_api',{}).get('refresh_version') or old.get('digest_prompt_version')!=VERSION):
                  subprocess.run(['python','-m','pipeline.news_update','--reuse-body-cache','--model-limit','0','--model-budget-seconds','0'],check=True)
          PY
      - name: Install online probability classifier dependencies
        if: github.event_name == 'push' || (inputs.quotes_only != true && github.event.schedule != '5,10,15,20,25,35,40,45,50,55 1-7 * * 1-5' && (!inputs.probe_group || inputs.probe_group == 'none'))
        run: python -m pip install -r requirements-direction-training.txt
      - name: Train online classifier only for newly completed data
        if: github.event_name == 'push' || (inputs.quotes_only != true && github.event.schedule != '5,10,15,20,25,35,40,45,50,55 1-7 * * 1-5' && (!inputs.probe_group || inputs.probe_group == 'none'))
        env:
          RADAR_ALLOW_DIRECTION_TRAINING: 'true'
          RADAR_ALLOW_TRAINING: 'false'
          MPLCONFIGDIR: /tmp/radar-matplotlib
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: python -m pipeline.online_direction_update
      - name: Refresh cached inference without training
        if: github.event_name == 'push' && hashFiles('data/equity/bootstrap-complete.json') != ''
        env:
          RADAR_ALLOW_TRAINING: 'false'
        run: python -m pipeline.equity_update --offline --max-requests 0
      - name: Build lightweight website snapshot and health summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pipeline.publish import publish_view, health_summary
          from pipeline.run import atomic_json
          data = json.loads(Path('web/data/dashboard.json').read_text())
          publish_view(data, 'web/data/view.json')
          health = health_summary(data)
          atomic_json('web/data/health.json', health)
          print('DATA_HEALTH ' + json.dumps(health, ensure_ascii=False, allow_nan=False))
          print('VIEW_BYTES', Path('web/data/view.json').stat().st_size)
          PY
      - name: Persist observations and forecast ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/dashboard.json web/data/reviews.json web/data/view.json web/data/health.json
          if [ -f web/data/page-quotes.json ]; then git add web/data/page-quotes.json; fi
          if [ -f web/data/tushare-capabilities.json ]; then git add web/data/tushare-capabilities.json; fi
          if [ -d data/equity ]; then git add data/equity; fi
          if [ -d data/news_sentiment ]; then git add data/news_sentiment; fi
          if [ -d data/news_archive ]; then git add data/news_archive; fi
          if [ -f web/data/data-service-capabilities.json ]; then git add web/data/data-service-capabilities.json; fi
          if [ -f web/data/minute-access.json ]; then git add web/data/minute-access.json; fi
          if [ -d web/data/articles ]; then git add web/data/articles; fi
          if [ -d data/news_content ]; then git add data/news_content; fi
          if [ -d data/direction_probability ]; then git add data/direction_probability; fi
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh observations and daily review [skip ci]'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: web
  deploy:
    needs: research
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

worker_processes 1;
pid nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    log_format visitor escape=json '{"at":"$time_iso8601","ip":"$remote_addr","host":"$host","path":"$uri","status":$status,"ua":"$http_user_agent"}';
    server_tokens off;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_zone $binary_remote_addr zone=assistant_req:10m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=assistant_conn:10m;
    limit_req_zone $binary_remote_addr zone=account_req:10m rate=30r/m;
    include /opt/ashare-radar-preview/deploy/tencent-preview/nginx-security-headers.conf;
    sendfile on;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css;
    client_body_temp_path client_body;
    proxy_temp_path proxy;
    fastcgi_temp_path fastcgi;
    uwsgi_temp_path uwsgi;
    scgi_temp_path scgi;

    server {
        listen 127.0.0.1:8769;
        server_name _;
        if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
        root /srv/ashare-radar-preview/public;
        index index.html;
        autoindex off;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /admin {
            absolute_redirect off;
            return 302 /admin/;
        }

        location ~ "^/(?:admin/|api/(?:account|admin)(?:/|$))" {
            proxy_pass http://unix:/run/ashare-account/account.sock;
            proxy_set_header Host $http_host;
            proxy_set_header X-Account-Peer $remote_addr;
            limit_req zone=account_req burst=15 nodelay;
            client_max_body_size 4k;
            proxy_read_timeout 15s;
        }

        location /api/research-assistant/ {
            proxy_pass http://unix:/run/ashare-research-assistant/assistant.sock;
            proxy_set_header Host $http_host;
            proxy_set_header X-Research-Peer $remote_addr;
            limit_req zone=assistant_req burst=3 nodelay;
            limit_conn assistant_conn 2;
            client_max_body_size 64k;
            proxy_read_timeout 250s;
            proxy_buffering off;
            gzip off;
        }

        location = /internal/research-assistant/identity {
            return 404;
        }

        location = /data/connected-sources.json {
            alias /var/lib/ashare-radar-preview/request-usage/connected-sources.json;
            add_header Cache-Control "no-cache" always;
            include /opt/ashare-radar-preview/deploy/tencent-preview/nginx-security-headers.conf;
        }

        location = /data/funds.json {
            alias /var/lib/ashare-radar-preview/request-usage/public-funds.json;
            expires -1;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
            include /opt/ashare-radar-preview/deploy/tencent-preview/nginx-security-headers.conf;
            sub_filter '<head>' '<head><meta name="radar-live-quotes" content="sxdata">';
            sub_filter './app.js?v=' './app.js?v=funds-20261126-';
            sub_filter './styles.css?v=' './styles.css?v=funds-20261126-';
            sub_filter_once off;
        }

        location /data/ {
            add_header Cache-Control "no-cache" always;
            include /opt/ashare-radar-preview/deploy/tencent-preview/nginx-security-headers.conf;
            try_files $uri =404;
        }

        location = /data/page-quotes.json {
            return 404;
        }

        location ~ "^/data/((?:sector-(?:quotes|hot|reference)|board-live-summary)\.json)$" {
            add_header Cache-Control "no-cache" always;
            include /opt/ashare-radar-preview/deploy/tencent-preview/nginx-security-headers.conf;
            alias /var/lib/ashare-radar-preview/quote-output/$1;
        }

        location ~ "^/data/sector-intraday/([0-9]{6}\.(?:SH|SZ)\.json)$" {
            add_header Cache-Control "no-cache" always;
            include /opt/ashare-radar-preview/deploy/tencent-preview/nginx-security-headers.conf;
            alias /var/lib/ashare-radar-preview/quote-output/sector-intraday/$1;

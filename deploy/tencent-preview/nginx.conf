worker_processes 1;
pid nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css;
    client_body_temp_path client_body;
    proxy_temp_path proxy;
    fastcgi_temp_path fastcgi;
    uwsgi_temp_path uwsgi;
    scgi_temp_path scgi;

    server {
        listen 127.0.0.1:8769;
        server_name _;
        root /srv/ashare-radar-preview/public;
        index index.html;
        autoindex off;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /admin {
            absolute_redirect off;
            return 302 /admin/;
        }

        location ~ "^/(?:admin/|api/(?:account|admin)(?:/|$))" {
            proxy_pass http://unix:/run/ashare-account/account.sock;
            proxy_set_header Host $http_host;
            proxy_set_header X-Account-Peer $remote_addr;
            client_max_body_size 4k;
            proxy_read_timeout 15s;
        }

        location /api/research-assistant/ {
            proxy_pass http://unix:/run/ashare-research-assistant/assistant.sock;
            proxy_set_header Host $http_host;
            client_max_body_size 64k;
            proxy_read_timeout 250s;
            proxy_buffering off;
            gzip off;
        }

        location = /internal/research-assistant/identity {
            return 404;
        }

        location = /data/connected-sources.json {
            alias /var/lib/ashare-radar-preview/request-usage/connected-sources.json;
            add_header Cache-Control "no-cache" always;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
            sub_filter '<head>' '<head><meta name="radar-live-quotes" content="sxdata">';
            sub_filter './app.js?v=' './app.js?v=relay-research-dataset-v2-';
            sub_filter './styles.css?v=' './styles.css?v=relay-research-dataset-v1-';
            sub_filter_once off;
        }

        location /data/ {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location = /data/page-quotes.json {
            return 404;
        }

        location ~ "^/data/((?:sector-(?:quotes|hot|reference)|board-live-summary)\.json)$" {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/quote-output/$1;
        }

        location ~ "^/data/sector-intraday/([0-9]{6}\.(?:SH|SZ)\.json)$" {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/quote-output/sector-intraday/$1;
        }

        location ~ "^/data/sector-members/([0-9]{6}(?:\.(?:SH|SZ|SI)|R?\.TI))\.json$" {
            set $sector_member $1;
            proxy_pass http://unix:/run/ashare-sector-directory/members.sock;
            proxy_read_timeout 6s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @sector_member_cache;
            add_header Cache-Control "no-store" always;
        }

        location ~ "^/data/asset-research/(stock|index|sector)/([0-9]{5,6}R?\.(?:SH|SZ|SI|TI|BJ|NQ|HK))\.json$" {
            set $research_kind $1;
            set $research_code $2;
            proxy_pass http://unix:/run/ashare-asset-research/research.sock;
            proxy_read_timeout 8s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @asset_research_cache;
            add_header Cache-Control "no-store" always;
        }

        location @asset_research_cache {
            root /var/lib/ashare-radar-preview/quote-output;
            try_files /asset-research/$research_kind/$research_code.json =503;
            add_header Cache-Control "no-store" always;
        }

        location @sector_member_cache {
            root /var/lib/ashare-radar-preview/quote-output;
            try_files /sector-members/$sector_member.json =503;
            add_header Cache-Control "no-store" always;
        }

        location = /data/live-quotes.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/quote-output/live-quotes.json;
        }

        location = /data/today-intraday.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/quote-output/today-intraday.json;
        }

        location = /data/minute-recovery.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/quote-output/minute-recovery.json;
        }

        location = /data/stock-quotes.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/quote-output/stock-quotes.json;
        }

        location = /data/trends.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/quote-output/trends.json;
        }

        location = /data/trend-brief.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/quote-output/trend-brief.json;
        }

        location = /data/market-insights.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/quote-output/market-insights.json;
        }

        location = /data/market-reading.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/quote-output/market-reading.json;
        }

        location = /data/weekend-brief.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/quote-output/weekend-brief.json;
        }

        location = /data/economic-calendar.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/quote-output/economic-calendar.json;
        }

        location = /data/daily-market.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/quote-output/daily-market.json;
        }

        location = /data/cloud-news.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/request-usage/public-news.json;
        }

        location = /data/company-announcements.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/quote-output/company-announcements.json;
        }

        location = /data/company-announcements-week.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/quote-output/company-announcements-week.json;
        }

        location ~ "^/data/announcement-analysis/([0-9]{4}-[0-9]{2}-[0-9]{2}\.json)$" {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/quote-output/announcement-analysis/$1;
        }

        location ~ "^/data/company-announcements/([0-9]{4}-[0-9]{2}-[0-9]{2}\.json)$" {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/quote-output/company-announcements/$1;
        }

        location = /data/cloud-models.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/model-output/models.json;
        }

        location = /data/cloud-research.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/request-usage/public-research.json;
        }

        location = /data/view.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/request-usage/public-view.json;
        }

        location = /data/health.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/request-usage/public-health.json;
        }

        location = /data/training-progress.json {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/request-usage/public-training-progress.json;
        }

        location ~ "^/data/cloud-articles/([a-f0-9]{64}\.json)$" {
            add_header Cache-Control "no-cache" always;
            alias /var/lib/ashare-radar-preview/news-output/articles/$1;
        }

        location = /data/dashboard.json {
            return 404;
        }

        location ~ /\. {
            return 404;
        }
    }


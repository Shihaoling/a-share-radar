                include /opt/ashare-radar-preview/deploy/tencent-preview/nginx-security-headers.conf;
                alias /var/lib/ashare-radar-preview/news-output/articles/$1;
            }

            location = /data/dashboard.json {
                return 404;
            }

            location ~ /\. {
                return 404;
            }
        }
}
